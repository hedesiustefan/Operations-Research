[project]
name = "operations-research"
version = "0.1.0"
description = ""
authors = [
    {name = "hedesiustefan",email = "stefan.hedesiu@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy (>=2.5.3,<3.0.0)",
    "scipy (>=1.18.1,<2.0.0)",
    "pandas (>=3.0.6,<4.0.0)",
    "matplotlib (>=3.11.2,<4.0.0)",
    "networkx (>=3.7,<4.0)",
    "pulp (>=4.0.0,<5.0.0)",
    "pyomo (>=6.10.1,<7.0.0)",
    "highspy (>=1.15.1,<2.0.0)",
    "ortools (>=9.15.6755,<10.0.0)",
    "cvxpy (>=1.9.3,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
ipykernel = "^7.4.0"
